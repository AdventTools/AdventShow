name: Build Linux (AppImage)

# Windows si macOS sunt build-uite local si semnate (Developer ID, Azure Trusted
# Signing) inainte de tag. CI-ul construieste doar AppImage-ul de Linux, care nu se
# semneaza, si il urca DIRECT in hangar — nu in GitHub Releases: din v1.4.0
# distributia si update-urile trec exclusiv prin hangar.it4all.ro.
#
# Secretul HANGAR_TOKEN e un token de upload legat de proiectul adventshow. NU poate
# promova: fisierul ajunge in aceeasi versiune deja publicata, iar hub-ul isi
# regenereaza singur feed-urile. Daca secretul lipseste, AppImage-ul ramane ca
# artefact de workflow, ca sa nu se piarda build-ul.

on:
  push:
    tags:
      - 'v*'
  # fallback manual: gh workflow run build.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Secretul se ridica in env la nivel de job: contextul `secrets` NU e disponibil
    # in conditiile `if` ale pasilor, dar `env` este.
    env:
      HUB_TOKEN: ${{ secrets.HANGAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retries: 3
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Build Linux
        run: npm run build && npx electron-builder --linux --publish never

      - name: Push AppImage to hangar
        if: ${{ env.HUB_TOKEN != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          curl -sfO https://hangar.it4all.ro/hub/tools/hub-push.mjs
          # Fara .yml: hangar genereaza feed-urile din baza lui de date.
          node hub-push.mjs --project adventshow --version "$VERSION" \
            release/"$VERSION"/*.AppImage

      - name: Keep AppImage as artifact when no hangar token
        if: ${{ env.HUB_TOKEN == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AdventShow-Linux
          path: release/**/*.AppImage
          if-no-files-found: error
